project:
  name: "WorkForce Data Analysis v2"
  version: "2.0.0"
  seed: 42

data:
  raw_path: "data/raw/employee_data.csv"
  interim_dir: "data/interim/"
  processed_dir: "data/processed/"
  schema_path: "config/schema.yaml"
  pii_columns:
    - "FirstName"
    - "LastName"
    - "ADEmail"
  date_columns:
    - "StartDate"
    - "ExitDate"
    - "DOB"

features:
  age_bins: [0, 29, 39, 49, 59, 69, 120]
  age_labels: ["<30", "30s", "40s", "50s", "60s", "70+"]
  mappings_path: "config/categorical_mappings.yaml"
  generate_embeddings: true

nlp:
  columns:
    TerminationDescription:
      enabled: true
      sentiment: true
      topic_modeling: true
      classification: true
      keywords: true
      embeddings: true
    Title:
      enabled: true
      embeddings: true
      similarity: true
    JobFunctionDescription:
      enabled: true
      embeddings: true
      clustering: true
    Supervisor:
      enabled: true
      network_analysis: true
  sentiment_model: "vader"
  topic_model: "lda"
  n_topics: 6
  embedding_model: "all-MiniLM-L6-v2"
  classifier: "logistic"

imputation:
  strategy: "ensemble"
  target_columns: ["Age", "DOB"]
  feature_columns:
    - "JobFamily"
    - "SeniorityLevel"
    - "DivisionGroup"
    - "Region"
    - "GenderCode"
    - "Performance Score"
    - "Current Employee Rating"
  test_size: 0.2
  models:
    rf:
      n_estimators: 300
      max_depth: 10
    gbm:
      n_estimators: 200
      learning_rate: 0.05
  jitter_range: [-1.5, 1.5]
  random_state: 42

analysis:
  attrition:
    survival_method: "kaplan_meier"
    confidence_interval: 0.95
  diversity:
    significance_level: 0.05
    benchmark_source: null
  forecasting:
    method: "prophet"
    forecast_periods: 12
    seasonality: ["yearly", "quarterly"]

output:
  formats: ["csv", "parquet"]
  compression: "snappy"
  clean_versions: 3
  export_visualizations: true
  visualization_dir: "reports/figures/"
