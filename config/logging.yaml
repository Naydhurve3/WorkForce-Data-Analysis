version: 1
formatters:
  default:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
handlers:
  console:
    class: "logging.StreamHandler"
    level: "INFO"
    formatter: "default"
    stream: "ext://sys.stdout"
  file:
    class: "logging.handlers.RotatingFileHandler"
    level: "DEBUG"
    formatter: "default"
    filename: "logs/pipeline.log"
    maxBytes: 10485760
    backupCount: 3
root:
  level: "DEBUG"
  handlers: ["console", "file"]
