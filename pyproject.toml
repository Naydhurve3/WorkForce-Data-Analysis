[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wf_analysis"
version = "2.0.0"
description = "Workforce Data Analytics Pipeline - Cleaning, NLP, ML Imputation, EDA, and Dashboarding"
readme = "README.md"
authors = [
    {name = "Naydhurve3"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "sentence-transformers>=2.2",
    "vaderSentiment>=3.3",
    "nltk>=3.8",
    "gensim>=4.3",
    "networkx>=3.0",
    "lifelines>=0.27",
    "prophet>=1.1",
    "streamlit>=1.25",
    "plotly>=5.15",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "flake8>=6.1",
    "mypy>=1.5",
    "black>=23.7",
    "pre-commit>=3.3",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=wf_analysis --cov-report=term-missing"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
